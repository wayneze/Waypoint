[package]
name = "waypoint"
version = "0.1.0"
description = "Windows desktop workspace for game schedules, collections and guides"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "waypoint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled", "backup", "serialize"] }
ring = "0.17"
aws-lc-rs = "1.19"
base64 = "0.22"
tempfile = "3"
tar = "0.4"
quick-xml = "0.42"
reqwest = { version = "0.13", features = ["json", "cookies", "query", "form"] }
bytes = "1"
http-body = "1"
encoding_rs = "0.8"
scraper = "0.24"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "sync", "time"] }
urlencoding = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
flate2 = "1.0"
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Controls_Dialogs", "Win32_Security", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
